apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-service
  namespace: analytics-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analytics-service
  template:
    metadata:
      labels:
        app: analytics-service
    spec:
      imagePullSecrets:
      - name: ecr-secret
      containers:
      - name: analytics-service
        image: 590183807419.dkr.ecr.us-east-1.amazonaws.com/analytics-service
        imagePullPolicy: Always
        ports:
        - containerPort: 8005
        envFrom:
        - configMapRef:
            name: analytics-service-env
        resources:
          requests:
            cpu: 100m
            memory: 50Mi
          limits:
            cpu: 200m
            memory: 100Mi
